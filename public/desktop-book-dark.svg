<text x="687.36" y="738.14" font-family="Inter" font-size="14" font-weight="500" fill="#a79e91">rated it 5</text></g>
<g><text x="646.94" y="761.14" font-family="Inter" font-size="15" font-weight="400" fill="#f1eadf">Quieter than Jane Eyre and stranger. Lucy</text>
<text x="646.94" y="783.64" font-family="Inter" font-size="15" font-weight="400" fill="#f1eadf">Snowe stays with you long after the last</text>
<text x="646.94" y="806.14" font-family="Inter" font-size="15" font-weight="400" fill="#f1eadf">page.</text></g></g></g>
