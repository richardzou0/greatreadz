<text x="1105.28" y="738.14" font-family="Inter" font-size="14" font-weight="500" fill="#a79e91">rated it 4</text></g>
<g><text x="1059.94" y="761.14" font-family="Inter" font-size="15" font-weight="400" fill="#f1eadf">Slow first hundred pages, then I could not</text>
<text x="1059.94" y="783.64" font-family="Inter" font-size="15" font-weight="400" fill="#f1eadf">put it down. Read it in winter.</text></g></g></g></g></g>
