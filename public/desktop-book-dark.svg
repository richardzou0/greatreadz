<text x="1166.58" y="458.36" font-family="Inter" font-size="10" font-weight="600" fill="#82c9a6">Summary · beta</text></g></g>
<g><text x="1012.94" y="487.36" font-family="Inter" font-size="16" font-weight="400" fill="#f1eadf">Readers love Lucy's sharp, guarded voice and</text>
<text x="1012.94" y="512.16" font-family="Inter" font-size="16" font-weight="400" fill="#f1eadf">the ending. Many say the first third is slow and</text>
<text x="1012.94" y="536.95" font-family="Inter" font-size="16" font-weight="400" fill="#f1eadf">the payoff is worth it. Common words:</text>
<text x="1012.94" y="561.75" font-family="Inter" font-size="16" font-weight="400" fill="#f1eadf">haunting, lonely, sharp.</text>
<text x="1193.45" y="561.75" font-family="Inter" font-size="16" font-weight="600" fill="#82c9a6">Read reviews</text></g></g></g>
<g><g><text x="579.94" y="690.14" font-family="Inter" font-size="12" font-weight="600" letter-spacing="0.96" fill="#a79e91">FROM PEOPLE YOU FOLLOW</text>
